<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}GitFolio — Your GitHub, Print-Ready{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            dark:   "#0a0c10",
            darker: "#0d1018",
            card:   "#13161d",
            header: "#0f1117",
          }
        }
      }
    }
  </script>
  <style>
    body { background: #0a0c10; color: #f0f0f0; }
    .border-subtle { border-color: rgba(255,255,255,0.07); }
    .pulse-dot { animation: pulse 1.4s ease-in-out infinite; }
    @keyframes pulse { 0%,100%{ opacity:1; } 50%{ opacity:0.2; } }
  </style>
</head>
<body class="min-h-screen flex flex-col font-sans">

  <!-- NAV -->
  <nav class="flex items-center justify-between px-10 border-b border-subtle flex-shrink-0" style="height:52px;">
    <a href="/" class="flex items-center gap-2 text-white font-semibold text-sm">
      <span class="w-2 h-2 rounded-full bg-blue-600 inline-block"></span>
      GitFolio
    </a>
    <div class="flex items-center gap-6">
      <a href="/examples/" class="text-xs text-gray-500 hover:text-gray-300 transition-colors">Examples</a>
      <a href="https://github.com" target="_blank" class="text-xs text-gray-500 hover:text-gray-300 transition-colors">GitHub</a>
      <span class="text-xs text-green-400 bg-green-900/20 border border-green-800/40 px-3 py-1 rounded-full font-mono">
        100% free
      </span>
    </div>
  </nav>

  {% block content %}{% endblock %}

  <!-- FOOTER -->
  <footer class="flex items-center justify-between px-10 py-4 border-t border-subtle mt-auto">
    <span class="text-xs text-gray-600 font-mono">gitfolio · built in Accra 🇬🇭 · free forever</span>
    <div class="flex gap-5">
      <a href="#" class="text-xs text-gray-600 hover:text-gray-400">Privacy</a>
      <a href="#" class="text-xs text-gray-600 hover:text-gray-400">Contact</a>
    </div>
  </footer>

</body>
</html>
